[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stageledger"
version = "0.2.0"
description = "Offline equipment reservation auditing and packing checklists for community events."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "StageLedger contributors"}]
keywords = ["events", "inventory", "audio", "equipment", "open-source"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Scheduling"
]

[project.scripts]
stageledger = "stageledger.cli:main"

[tool.setuptools.packages.find]
include = ["stageledger*"]
